<style>
:root{
  --mist:#dde7e8; --ink:#1b2a33; --beak:#f28a1e; --feather:#fbfbf8; --muted:#4d6068;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --mist:#111b20; --ink:#edf2f2; --feather:#1c2a31; --muted:#9db0b7; color-scheme:dark; }
}
:root[data-theme="dark"]{ --mist:#111b20; --ink:#edf2f2; --feather:#1c2a31; --muted:#9db0b7; color-scheme:dark; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; min-height:100%; background:var(--mist); color:var(--ink);
  font-family:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:48px 20px;
}
main{ width:100%; max-width:380px; text-align:center; }
.avatar{
  width:112px; height:112px; border-radius:50%; margin:0 auto 20px;
  background:var(--feather); border:4px solid var(--beak);
  display:flex; align-items:center; justify-content:center; font-size:56px; overflow:hidden;
}
.avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
h1{ margin:0 0 32px; font-size:2.6rem; font-weight:800; letter-spacing:-0.02em; line-height:1; }
.links{ display:flex; flex-direction:column; gap:18px; }
.link{
  display:flex; align-items:center; gap:16px; text-align:left; text-decoration:none; color:var(--ink);
  background:var(--feather); border:2px solid var(--ink); border-radius:14px; padding:16px 18px;
  box-shadow:5px 5px 0 var(--beak); transition:transform .12s ease, box-shadow .12s ease;
}
.link:hover{ transform:translate(2px,2px); box-shadow:3px 3px 0 var(--beak); }
.link:active{ transform:translate(5px,5px); box-shadow:0 0 0 var(--beak); }
.link:focus-visible{ outline:3px solid var(--ink); outline-offset:4px; }
.link svg{ width:30px; height:30px; flex:none; }
.name{ display:block; font-weight:800; font-size:1.15rem; line-height:1.2; }
.handle{ display:block; font-weight:600; font-size:.95rem; color:var(--muted); }
@media (prefers-reduced-motion: reduce){ .link{ transition:none; } }
</style>
</head>
